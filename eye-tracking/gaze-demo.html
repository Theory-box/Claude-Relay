<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webcam Gaze Prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d0f12; color: #e6e9ef;
  }
  #stage { position: fixed; inset: 0; }
  .dot {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; cursor: pointer; transition: transform .1s, opacity .2s;
    background: #ff4d5e; box-shadow: 0 0 14px #ff4d5e88;
  }
  .dot small { position:absolute; inset:0; display:grid; place-items:center; font-size:11px; color:#fff; }
  .dot.done { background:#2ec16e; box-shadow:0 0 14px #2ec16e88; opacity:.55; }
  #gaze {
    position: fixed; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; border: 2px solid #4da3ff; background: #4da3ff22;
    pointer-events: none; display: none; z-index: 40; transition: none;
  }
  #grid { position: fixed; inset: 0; display: none; z-index: 20; pointer-events: none; }
  .cell { position: absolute; border: 1px solid #ffffff14; transition: background .15s; }
  .cell span { position:absolute; top:6px; left:8px; font-size:11px; color:#ffffff55; }
  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 60; max-width: 340px;
    background: #161a20ee; border: 1px solid #ffffff14; border-radius: 12px; padding: 16px 18px;
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  p { font-size: 13px; line-height: 1.5; color: #aab2c0; margin: 6px 0; }
  button {
    font: inherit; font-size: 13px; padding: 8px 14px; margin: 4px 6px 0 0; cursor: pointer;
    background: #2b3442; color: #e6e9ef; border: 1px solid #ffffff1a; border-radius: 8px;
  }
  button:hover { background: #364154; }
  button.primary { background: #3b7dff; border-color: #3b7dff; }
  #stat { font-variant-numeric: tabular-nums; font-size: 12px; color: #7f8b9c; margin-top: 8px; }
  #vidwrap { position: fixed; bottom: 12px; right: 12px; z-index: 60; display:none; opacity:.4; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="grid"></div>
  <div id="gaze"></div>

  <div id="panel">
    <h1>Webcam gaze prototype</h1>
    <p id="msg">Sit 50–70cm away, face lit from the front, head fairly still. Grant camera access to begin.</p>
    <div id="controls">
      <button class="primary" id="start">Start</button>
      <button id="toggleGrid" hidden>Toggle heatmap</button>
      <button id="toggleVid" hidden>Toggle video</button>
      <button id="recal" hidden>Recalibrate</button>
    </div>
    <div id="stat"></div>
  </div>

  <div id="vidwrap"></div>

  <!-- WebGazer from CDN (any host works when served locally) -->
  <script src="https://cdn.jsdelivr.net/npm/webgazer@3.3.0/dist/webgazer.min.js"></script>
  <script>
  const stage = document.getElementById('stage');
  const gaze  = document.getElementById('gaze');
  const grid  = document.getElementById('grid');
  const msg   = document.getElementById('msg');
  const stat  = document.getElementById('stat');
  const CLICKS_NEEDED = 5;
  let mode = 'idle';
  let heat = new Array(9).fill(0);
  let lastTs = performance.now();

  // 9 calibration points as fractions of the viewport
  const pts = [[.1,.1],[.5,.1],[.9,.1],[.1,.5],[.5,.5],[.9,.5],[.1,.9],[.5,.9],[.9,.9]];

  document.getElementById('start').onclick = begin;
  document.getElementById('recal').onclick = () => { clearGaze(); startCalibration(); };
  document.getElementById('toggleGrid').onclick = () =>
    grid.style.display = grid.style.display === 'block' ? 'none' : 'block';
  document.getElementById('toggleVid').onclick = () => {
    const w = document.getElementById('vidwrap');
    w.style.display = w.style.display === 'block' ? 'none' : 'block';
  };

  function buildGrid() {
    grid.innerHTML = '';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const d = document.createElement('div');
      d.className = 'cell';
      d.style.left = (c/3*100)+'%'; d.style.top = (r/3*100)+'%';
      d.style.width = '33.333%'; d.style.height = '33.333%';
      d.innerHTML = '<span></span>';
      grid.appendChild(d);
    }
  }

  async function begin() {
    document.getElementById('start').hidden = true;
    msg.textContent = 'Requesting camera…';
    try {
      await webgazer
        .setRegression('ridge')
        .setGazeListener(onGaze)
        .begin();
      webgazer.showVideoPreview(false).showPredictionPoints(false).showFaceOverlay(false);
      // move webgazer's internal video into our corner widget, hidden by default
      const vwrap = document.getElementById('vidwrap');
      const wgVid = document.getElementById('webgazerVideoContainer');
      if (wgVid) { wgVid.style.position='static'; vwrap.appendChild(wgVid); }
      buildGrid();
      startCalibration();
    } catch (e) {
      msg.textContent = 'Camera blocked. Serve this over http://localhost (not file://) and allow the camera. Error: ' + e;
    }
  }

  function startCalibration() {
    mode = 'calibrate';
    ['toggleGrid','toggleVid','recal'].forEach(id => document.getElementById(id).hidden = true);
    gaze.style.display = 'none';
    stage.innerHTML = '';
    msg.textContent = 'Click each red dot ' + CLICKS_NEEDED + ' times while looking straight at it. Green = done.';
    pts.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'dot'; d.dataset.clicks = 0;
      d.style.left = (p[0]*100)+'%'; d.style.top = (p[1]*100)+'%';
      d.innerHTML = '<small>'+CLICKS_NEEDED+'</small>';
      d.onclick = () => {
        let c = ++d.dataset.clicks;
        d.querySelector('small').textContent = Math.max(0, CLICKS_NEEDED - c);
        if (c >= CLICKS_NEEDED) { d.classList.add('done'); d.onclick = null; }
        if ([...stage.children].every(x => x.classList.contains('done'))) validate();
      };
      stage.appendChild(d);
    });
  }

  // crude validation: user fixates center, we measure mean prediction error
  function validate() {
    mode = 'validate';
    stage.innerHTML = '';
    const cx = innerWidth/2, cy = innerHeight/2;
    const d = document.createElement('div');
    d.className = 'dot'; d.style.left='50%'; d.style.top='50%';
    stage.appendChild(d);
    msg.textContent = 'Now just STARE at the centre dot…';
    let samples = [];
    const grab = (g) => { if (g) samples.push([g.x, g.y]); };
    validateGrab = grab;
    setTimeout(() => {
      validateGrab = null;
      let err = samples.length
        ? samples.reduce((s,[x,y]) => s + Math.hypot(x-cx, y-cy), 0)/samples.length
        : NaN;
      // rough deg estimate: assume ~60cm dist, screen px/cm from window width guess
      const pxPerCm = innerWidth / 29.3;             // ~13.6" Air width
      const deg = Math.atan((err/pxPerCm)/60) * 180/Math.PI;
      stat.textContent = `Validation: ~${err.toFixed(0)} px error  ≈  ${deg.toFixed(1)}° visual angle  (${samples.length} samples)`;
      finishCalibration();
    }, 3000);
  }

  function finishCalibration() {
    mode = 'live';
    stage.innerHTML = '';
    gaze.style.display = 'block';
    ['toggleGrid','toggleVid','recal'].forEach(id => document.getElementById(id).hidden = false);
    msg.textContent = 'Live. The blue ring is your predicted gaze. Toggle the heatmap to see region-level dwell.';
  }

  let validateGrab = null;
  function onGaze(g) {
    if (!g) return;
    if (mode === 'validate' && validateGrab) validateGrab(g);
    if (mode !== 'live') return;
    gaze.style.left = g.x + 'px';
    gaze.style.top  = g.y + 'px';
    // accumulate dwell time into 3x3 cell
    const now = performance.now(), dt = now - lastTs; lastTs = now;
    const col = Math.min(2, Math.max(0, Math.floor(g.x / (innerWidth/3))));
    const row = Math.min(2, Math.max(0, Math.floor(g.y / (innerHeight/3))));
    const idx = row*3 + col;
    heat[idx] += dt;
    const max = Math.max(...heat, 1);
    [...grid.children].forEach((cell, i) => {
      const a = heat[i]/max;
      cell.style.background = `rgba(77,163,255,${(a*0.5).toFixed(3)})`;
      cell.querySelector('span').textContent = (heat[i]/1000).toFixed(1)+'s';
    });
  }

  function clearGaze(){ heat = new Array(9).fill(0); }
  </script>
</body>
</html>
