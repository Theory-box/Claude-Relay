name: build-mac-app

on:
  push:
    branches: [feature/gamepad-mapper]
    paths:
      - 'tools/gamepad-mapper/app/**'
      - '.github/workflows/build-mac-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gamepad-mapper/app/src-tauri

      - name: Install Tauri CLI (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Generate icons
        working-directory: tools/gamepad-mapper/app/src-tauri
        run: cargo tauri icon ../icon-source.png

      - name: Engine tests
        working-directory: tools/gamepad-mapper/app/src-tauri
        run: cargo test

      - name: Build app (.app only)
        working-directory: tools/gamepad-mapper/app/src-tauri
        run: cargo tauri build --bundles app

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
        run: |
          echo "$MACOS_CERT_P12" | openssl base64 -d -A > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/cert.p12

      - name: Sign the app (stable self-signed identity)
        working-directory: tools/gamepad-mapper/app/src-tauri/target/release/bundle/macos
        run: codesign --force --deep -s "GamepadMapper Self Signed" "GamepadMapper.app"

      - name: Zip the app
        working-directory: tools/gamepad-mapper/app/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent "GamepadMapper.app" "$GITHUB_WORKSPACE/GamepadMapper-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GamepadMapper-mac-app
          path: GamepadMapper-mac.zip
