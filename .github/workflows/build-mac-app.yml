name: build-mac-app

on:
  push:
    branches: [feature/gamepad-mapper]
    paths:
      - 'tools/gamepad-mapper/app/**'
      - '.github/workflows/build-mac-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gamepad-mapper/app/src-tauri

      - name: Install Tauri CLI (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Generate icons
        working-directory: tools/gamepad-mapper/app/src-tauri
        run: cargo tauri icon ../icon-source.png

      - name: Engine tests
        working-directory: tools/gamepad-mapper/app/src-tauri
        run: cargo test

      - name: Build app (.app only)
        working-directory: tools/gamepad-mapper/app/src-tauri
        run: cargo tauri build --bundles app

      - name: Ad-hoc code sign (avoids "damaged" on Apple Silicon)
        working-directory: tools/gamepad-mapper/app/src-tauri/target/release/bundle/macos
        run: codesign --force --deep -s - "GamepadMapper.app"

      - name: Zip the app
        working-directory: tools/gamepad-mapper/app/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent "GamepadMapper.app" "$GITHUB_WORKSPACE/GamepadMapper-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GamepadMapper-mac-app
          path: GamepadMapper-mac.zip
