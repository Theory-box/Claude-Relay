name: Build Relay

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pythonnet zstandard
      - name: Build executable
        run: pyinstaller relay.spec
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Relay-windows
          path: dist/Relay.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Relay.exe
