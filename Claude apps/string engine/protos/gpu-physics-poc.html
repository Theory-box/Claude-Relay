<!doctype html><html><head><meta charset="utf-8"><title>GPU physics POC</title>
<style>html,body{margin:0;height:100%;background:#080a12;overflow:hidden}canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:10px;left:12px;color:#8ee;font:12px monospace;line-height:1.6;text-shadow:0 0 4px #000}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div>
<script>
const cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:true,alpha:false});
const hud=document.getElementById('hud');
const ext=gl.getExtension('EXT_color_buffer_float');
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw'shader: '+gl.getShaderInfoLog(o);return o;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw'link: '+gl.getProgramInfoLog(p);return p;}
// ---- grid of nodes: GX x GY, stored one-per-texel in an RGBA32F texture (pos.xy, prev.xy) ----
const GX=90, GY=60, N=GX*GY, SP=9;   // spacing (world px)
function makeTex(data){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,GX,GY,0,gl.RGBA,gl.FLOAT,data);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
const init=new Float32Array(N*4);
for(let y=0;y<GY;y++)for(let x=0;x<GX;x++){const i=(y*GX+x)*4;const wx=x*SP+40, wy=y*SP+30;init[i]=wx;init[i+1]=wy;init[i+2]=wx;init[i+3]=wy;}
let texA=makeTex(init), texB=makeTex(new Float32Array(N*4));
const fbo=gl.createFramebuffer();
// full-screen triangle for the compute passes
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const CVS=`#version 300 es
layout(location=0) in vec2 p; void main(){ gl_Position=vec4(p,0,1); }`;
// integrate: Verlet + gravity; pin the top row
const INTEGRATE=`#version 300 es
precision highp float; uniform sampler2D uPos; uniform vec2 uGrid; out vec4 o;
void main(){ ivec2 c=ivec2(gl_FragCoord.xy); vec4 s=texelFetch(uPos,c,0); vec2 pos=s.xy, prev=s.zw;
  bool pinned = (c.y==0) && (c.x%14==0);          // pin a few top nodes
  if(pinned){ o=vec4(pos,pos); return; }
  vec2 vel=clamp((pos-prev)*0.99,vec2(-40.0),vec2(40.0)); vec2 np=pos+vel+vec2(0.0,0.28);
  np=clamp(np,vec2(-5000.0),vec2(5000.0)); if(any(isnan(np))||any(isinf(np)))np=pos;
  o=vec4(np,pos); }`;
// one Jacobi constraint iteration: pull toward rest length with 4 structural neighbours
const CONSTRAIN=`#version 300 es
precision highp float; uniform sampler2D uPos; uniform vec2 uGrid; uniform float uRest; out vec4 o;
vec2 corr(ivec2 c, ivec2 d, vec2 pos, float rest){ ivec2 n=c+d;
  if(n.x<0||n.y<0||n.x>=int(uGrid.x)||n.y>=int(uGrid.y)) return vec2(0.0);
  vec2 q=texelFetch(uPos,n,0).xy; vec2 delta=q-pos; float dist=max(length(delta),0.001);
  return clamp(delta*((dist-rest)/dist)*0.5*0.25, vec2(-rest), vec2(rest)); }                    // 0.5 share * 0.5 relax
void main(){ ivec2 c=ivec2(gl_FragCoord.xy); vec4 s=texelFetch(uPos,c,0); vec2 pos=s.xy;
  bool pinned=(c.y==0)&&(c.x%14==0); if(pinned){ o=s; return; }
  vec2 k=corr(c,ivec2(1,0),pos,uRest)+corr(c,ivec2(-1,0),pos,uRest)+corr(c,ivec2(0,1),pos,uRest)+corr(c,ivec2(0,-1),pos,uRest);
  vec2 np=pos+k; if(any(isnan(np))||any(isinf(np)))np=pos; o=vec4(np, s.zw); }`;
const pInt=prog(CVS,INTEGRATE), pCon=prog(CVS,CONSTRAIN);
function bindQuad(p){gl.useProgram(p);const l=gl.getAttribLocation(p,'p');gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);}
function pass(p,src){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texB,0);
  gl.viewport(0,0,GX,GY);bindQuad(p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src);gl.uniform1i(gl.getUniformLocation(p,'uPos'),0);
  gl.uniform2f(gl.getUniformLocation(p,'uGrid'),GX,GY);gl.uniform1f(gl.getUniformLocation(p,'uRest'),SP);
  gl.disable(gl.BLEND); gl.drawArrays(gl.TRIANGLES,0,3); const t=texA;texA=texB;texB=t;}   // ping-pong
// ---- render: instanced links, vertex shader reads endpoint positions FROM the texture (no CPU readback) ----
const links=[]; for(let y=0;y<GY;y++)for(let x=0;x<GX;x++){ if(x+1<GX)links.push(x,y,x+1,y); if(y+1<GY)links.push(x,y,x,y+1); }
const linkArr=new Float32Array(links); const NL=linkArr.length/4;
const lbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,lbuf);gl.bufferData(gl.ARRAY_BUFFER,linkArr,gl.STATIC_DRAW);
const cornerBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cornerBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,-1,0,1,1,-1,1,1]),gl.STATIC_DRAW);
const RVS=`#version 300 es
layout(location=0) in vec2 aCorner; layout(location=1) in vec4 aLink;
uniform sampler2D uPos; uniform vec2 uA,uB; out float vT;
void main(){ vec2 p0=texelFetch(uPos, ivec2(aLink.xy),0).xy; vec2 p1=texelFetch(uPos, ivec2(aLink.zw),0).xy;
  float r=2.2; vec2 d=p1-p0; float L=length(d); vec2 dir=L>1e-4?d/L:vec2(1.,0.); vec2 perp=vec2(-dir.y,dir.x);
  vec2 world=mix(p0-dir*r,p1+dir*r,aCorner.x)+perp*aCorner.y*r; vT=aCorner.y; gl_Position=vec4(world*uA+uB,0,1); }`;
const RFS=`#version 300 es
precision highp float; in float vT; out vec4 o; void main(){ float a=1.0-smoothstep(0.6,1.0,abs(vT)); o=vec4(0.35+0.4*(1.0-abs(vT)),0.85,0.95,a); }`;
const pR=prog(RVS,RFS);
let W,H,DPR=Math.min(2,devicePixelRatio||1);
let uA=[0.001,-0.001],uB=[-0.9,0.9],diag='initializing…';
function setCam(){ const sc=DPR*0.42, ox=DPR*95, oy=DPR*12;   // fixed camera framing the FULL drape (world y up to ~1200)
  uA=[sc*2/cv.width, -sc*2/cv.height]; uB=[ox*2/cv.width-1, 1-oy*2/cv.height]; }
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;setCam();}
let f=0,fps=60,lt=performance.now();
const rfbo=gl.createFramebuffer();
function diagnose(){                        // read positions back and report (informational only — not driving the camera)
  gl.bindFramebuffer(gl.FRAMEBUFFER,rfbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texA,0);
  const buf=new Float32Array(GX*GY*4);
  try{ gl.readPixels(0,0,GX,GY,gl.RGBA,gl.FLOAT,buf); }catch(e){ diag='(float readback unsupported here — trust the picture)'; return; }
  let minY=1e30,maxY=-1e30,nan=0,ok=0;
  for(let i=0;i<GX*GY;i++){const y=buf[i*4+1];
    if(!isFinite(y)){nan++;continue;} ok++;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  diag = ok>0 ? `valid ${ok} · NaN ${nan} · y[${minY|0}..${maxY|0}]` : `ALL ${nan} nodes NaN`;
}
function frame(now){ const dt=now-lt;lt=now;fps=fps*0.9+(1000/Math.max(1,dt))*0.1;
  pass(pInt,texA); for(let k=0;k<12;k++) pass(pCon,texA);
  if(f%20===0) diagnose();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0.03,0.04,0.07,1);gl.clear(gl.COLOR_BUFFER_BIT); gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(pR);
  gl.bindBuffer(gl.ARRAY_BUFFER,cornerBuf);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.vertexAttribDivisor(0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,lbuf);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,0,0);gl.vertexAttribDivisor(1,1);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(gl.getUniformLocation(pR,'uPos'),0);
  gl.uniform2f(gl.getUniformLocation(pR,'uA'), uA[0], uA[1]);
  gl.uniform2f(gl.getUniformLocation(pR,'uB'), uB[0], uB[1]);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,NL);
  hud.textContent=`GPU PHYSICS · ${N.toLocaleString()} nodes · ${NL.toLocaleString()} constraints · ${Math.round(fps)} fps\n${diag}`;
  f++; requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
