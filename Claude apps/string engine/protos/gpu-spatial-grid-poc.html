<!doctype html><html><head><meta charset='utf-8'><title>GPU spatial-grid POC (collision broad phase)</title>
<style>html,body{margin:0;height:100%;background:#080a12;overflow:hidden;font:12px/1.5 monospace;color:#cde}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;top:10px;left:12px;white-space:pre;text-shadow:0 0 4px #000;max-width:96vw}
#err{position:fixed;bottom:10px;left:12px;color:#ff8a9a;white-space:pre-wrap;max-width:96vw}
.ok{color:#6ee7b7}.bad{color:#ff8a9a}</style></head>
<body><canvas id='c'></canvas><div id='hud'>starting…</div><div id='err'></div>
<script>
const INSERT=`
struct U { numSeg:u32, gx:u32, gy:u32, cap:u32, cell:f32, ox:f32, oy:f32, reach:f32, };
@group(0) @binding(0) var<storage, read>       segAB     : array<vec4<f32>>;
@group(0) @binding(1) var<storage, read_write> cellCount : array<atomic<u32>>;
@group(0) @binding(2) var<storage, read_write> cellBins  : array<u32>;
@group(0) @binding(3) var<storage, read_write> stats     : array<atomic<u32>>;
@group(0) @binding(4) var<uniform>             P         : U;
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid:vec3<u32>){
  let i=gid.x; if(i>=P.numSeg){ return; }
  let s=segAB[i]; let r=P.reach;
  let minx=min(s.x,s.z)-r; let maxx=max(s.x,s.z)+r; let miny=min(s.y,s.w)-r; let maxy=max(s.y,s.w)+r;
  let x0=i32(floor((minx-P.ox)/P.cell)); let x1=i32(floor((maxx-P.ox)/P.cell));
  let y0=i32(floor((miny-P.oy)/P.cell)); let y1=i32(floor((maxy-P.oy)/P.cell));
  for(var cy=y0; cy<=y1; cy=cy+1){
    for(var cx=x0; cx<=x1; cx=cx+1){
      if(cx<0 || cy<0 || cx>=i32(P.gx) || cy>=i32(P.gy)){ continue; }
      let cell=u32(cy)*P.gx+u32(cx);
      atomicAdd(&stats[1], 1u);
      let slot=atomicAdd(&cellCount[cell], 1u);
      if(slot<P.cap){ cellBins[cell*P.cap+slot]=i; } else { atomicAdd(&stats[0], 1u); }
    }
  }
}`;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),errEl=document.getElementById('err');
const setErr=s=>errEl.innerHTML=s;
// ---- generate test segments: a cloth-like grid of edges + a dense knot (to stress occupancy/overflow) ----
const SP=12, GXn=110, GYn=74;   // cloth node grid
const nodes=[]; for(let y=0;y<GYn;y++)for(let x=0;x<GXn;x++)nodes.push({x:60+x*SP+(Math.random()-0.5)*3, y:40+y*SP+(Math.random()-0.5)*3});
const segs=[];
for(let y=0;y<GYn;y++)for(let x=0;x<GXn;x++){const i=y*GXn+x; if(x+1<GXn)segs.push([i,i+1]); if(y+1<GYn)segs.push([i,i+GXn]);}
// dense knot: 600 short segments piled in one spot -> forces a cell over cap
const kx=700,ky=460; for(let n=0;n<600;n++){const a=nodes.length; nodes.push({x:kx+(Math.random()-0.5)*20,y:ky+(Math.random()-0.5)*20}); const b=nodes.length; nodes.push({x:kx+(Math.random()-0.5)*20,y:ky+(Math.random()-0.5)*20}); segs.push([a,b]);}
const numSeg=segs.length;
const segAB=new Float32Array(numSeg*4);
for(let k=0;k<numSeg;k++){const a=nodes[segs[k][0]],b=nodes[segs[k][1]]; segAB[k*4]=a.x;segAB[k*4+1]=a.y;segAB[k*4+2]=b.x;segAB[k*4+3]=b.y;}
// grid params
const F=Math.fround; const MARGIN=1.5; const reach=F(8+MARGIN), cell=F(16);
let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
for(const n of nodes){if(n.x<minx)minx=n.x;if(n.y<miny)miny=n.y;if(n.x>maxx)maxx=n.x;if(n.y>maxy)maxy=n.y;}
const ox=F(minx-reach-cell), oy=F(miny-reach-cell);
const gx=Math.ceil((maxx-minx+2*reach+2*cell)/cell), gy=Math.ceil((maxy-miny+2*reach+2*cell)/cell);
const numCells=gx*gy, CAP=64;
// ---- CPU reference grid ----
const cpuCount=new Uint32Array(numCells); let cpuTotal=0;
for(let k=0;k<numSeg;k++){const ax=segAB[k*4],ay=segAB[k*4+1],bx=segAB[k*4+2],by=segAB[k*4+3];
  const minx=F(Math.min(ax,bx)-reach),maxx=F(Math.max(ax,bx)+reach),miny=F(Math.min(ay,by)-reach),maxy=F(Math.max(ay,by)+reach);
  const x0=Math.floor(F(F(minx-ox)/cell)),x1=Math.floor(F(F(maxx-ox)/cell));
  const y0=Math.floor(F(F(miny-oy)/cell)),y1=Math.floor(F(F(maxy-oy)/cell));
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){if(cx<0||cy<0||cx>=gx||cy>=gy)continue;cpuCount[cy*gx+cx]++;cpuTotal++;}}
let cpuOverflow=0,cpuMax=0; for(let c=0;c<numCells;c++){if(cpuCount[c]>CAP)cpuOverflow+=cpuCount[c]-CAP; if(cpuCount[c]>cpuMax)cpuMax=cpuCount[c];}
// ---- WebGPU ----
async function run(){
  if(!navigator.gpu){hud.textContent='WebGPU not available';return;}
  const adapter=await navigator.gpu.requestAdapter(); if(!adapter){hud.textContent='no adapter';return;}
  const device=await adapter.requestDevice();
  device.pushErrorScope('validation');
  const mod=device.createShaderModule({code:INSERT});
  const ci=await mod.getCompilationInfo(); let bad=false;
  for(const m of ci.messages){ if(m.type==='error'){bad=true; setErr((errEl.innerHTML||'')+'WGSL L'+m.lineNum+':'+m.linePos+' '+m.message+'<br>');}}
  const pipe=await device.createComputePipelineAsync({layout:'auto',compute:{module:mod,entryPoint:'main'}});
  const perr=await device.popErrorScope(); if(perr){setErr((errEl.innerHTML||'')+'pipeline: '+perr.message);}
  if(bad){hud.textContent='shader compile failed (see below)';return;}
  const U=GPUBufferUsage;
  const mk=(data,usage)=>{const b=device.createBuffer({size:Math.max(16,data.byteLength),usage});device.queue.writeBuffer(b,0,data);return b;};
  const bSeg=mk(segAB,U.STORAGE|U.COPY_DST);
  const bCount=device.createBuffer({size:numCells*4,usage:U.STORAGE|U.COPY_DST|U.COPY_SRC});
  const bBins=device.createBuffer({size:numCells*CAP*4,usage:U.STORAGE|U.COPY_DST});
  const bStats=device.createBuffer({size:8,usage:U.STORAGE|U.COPY_DST|U.COPY_SRC});
  const pbuf=new ArrayBuffer(32),dv=new DataView(pbuf);
  dv.setUint32(0,numSeg,true);dv.setUint32(4,gx,true);dv.setUint32(8,gy,true);dv.setUint32(12,CAP,true);
  dv.setFloat32(16,cell,true);dv.setFloat32(20,ox,true);dv.setFloat32(24,oy,true);dv.setFloat32(28,reach,true);
  const bParams=device.createBuffer({size:32,usage:U.UNIFORM|U.COPY_DST}); device.queue.writeBuffer(bParams,0,pbuf);
  const bg=device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[
    {binding:0,resource:{buffer:bSeg}},{binding:1,resource:{buffer:bCount}},{binding:2,resource:{buffer:bBins}},{binding:3,resource:{buffer:bStats}},{binding:4,resource:{buffer:bParams}}]});
  // clear + dispatch (timed clean)
  device.queue.writeBuffer(bCount,0,new Uint32Array(numCells));
  device.queue.writeBuffer(bStats,0,new Uint32Array(2));
  await device.queue.onSubmittedWorkDone();
  const t0=performance.now();
  const enc=device.createCommandEncoder(); const pass=enc.beginComputePass(); pass.setPipeline(pipe); pass.setBindGroup(0,bg); pass.dispatchWorkgroups(Math.ceil(numSeg/64)); pass.end();
  device.queue.submit([enc.finish()]); await device.queue.onSubmittedWorkDone(); const ms=performance.now()-t0;
  // readback
  const rbC=device.createBuffer({size:numCells*4,usage:U.COPY_DST|U.MAP_READ});
  const rbS=device.createBuffer({size:8,usage:U.COPY_DST|U.MAP_READ});
  const e2=device.createCommandEncoder(); e2.copyBufferToBuffer(bCount,0,rbC,0,numCells*4); e2.copyBufferToBuffer(bStats,0,rbS,0,8); device.queue.submit([e2.finish()]);
  await rbC.mapAsync(GPUMapMode.READ); const gpuCount=new Uint32Array(rbC.getMappedRange().slice(0)); rbC.unmap();
  await rbS.mapAsync(GPUMapMode.READ); const gpuStats=new Uint32Array(rbS.getMappedRange().slice(0)); rbS.unmap();
  // compare exact per-cell
  let mism=0,firstMis=-1,gpuTotal=gpuStats[1],gpuOver=gpuStats[0],gpuMax=0;
  for(let c=0;c<numCells;c++){if(gpuCount[c]>gpuMax)gpuMax=gpuCount[c]; if(gpuCount[c]!==cpuCount[c]){mism++;if(firstMis<0)firstMis=c;}}
  const match=(mism===0 && gpuTotal===cpuTotal && gpuOver===cpuOverflow);
  // report
  hud.innerHTML=`<b>GPU SPATIAL-GRID POC · collision broad phase</b>
segments ${numSeg.toLocaleString()} · grid ${gx}×${gy} = ${numCells.toLocaleString()} cells · cap ${CAP} · build ${ms.toFixed(2)} ms
per-cell match: <span class='${mism===0?'ok':'bad'}'>${mism===0?'EXACT ('+numCells.toLocaleString()+' cells)':mism+' cells differ (first #'+firstMis+')'}</span>
insertions GPU ${gpuTotal.toLocaleString()} / CPU ${cpuTotal.toLocaleString()}  <span class='${gpuTotal===cpuTotal?'ok':'bad'}'>${gpuTotal===cpuTotal?'✓':'✗'}</span>
overflow  GPU ${gpuOver.toLocaleString()} / CPU ${cpuOverflow.toLocaleString()}  <span class='${gpuOver===cpuOverflow?'ok':'bad'}'>${gpuOver===cpuOverflow?'✓ (knot over cap='+CAP+', matches)':'✗'}</span>
max occupancy GPU ${gpuMax} / CPU ${cpuMax}
<b class='${match?'ok':'bad'}'>${match?'✓✓ GPU grid EXACTLY matches CPU reference':'✗ MISMATCH — broad phase incorrect'}</b>`;
  draw(gpuCount);
}
function draw(count){
  const DPR=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const sc=Math.min((innerWidth-40)/((gx*cell)),(innerHeight-120)/((gy*cell)))*0.98; const px=20, py=110;
  const W2S=(wx,wy)=>[px+(wx-ox)*sc, py+(wy-oy)*sc];
  // heatmap
  let mx=1; for(let c=0;c<count.length;c++)if(count[c]>mx)mx=count[c];
  for(let cy=0;cy<gy;cy++)for(let cx=0;cx<gx;cx++){const c=count[cy*gx+cx]; if(!c)continue;
    const t=Math.log(1+c)/Math.log(1+mx); ctx.fillStyle='rgba('+Math.round(40+t*215)+','+Math.round(60+t*80)+','+Math.round(120-t*80)+','+(0.15+t*0.55)+')';
    ctx.fillRect(px+cx*cell*sc, py+cy*cell*sc, cell*sc+0.5, cell*sc+0.5);}
  // segments
  ctx.strokeStyle='rgba(140,240,240,0.5)'; ctx.lineWidth=0.7; ctx.beginPath();
  for(let k=0;k<numSeg;k++){const s0=W2S(segAB[k*4],segAB[k*4+1]),s1=W2S(segAB[k*4+2],segAB[k*4+3]); ctx.moveTo(s0[0],s0[1]); ctx.lineTo(s1[0],s1[1]);}
  ctx.stroke();
}
run().catch(e=>{hud.textContent='error: '+e.message; setErr(String(e.stack||e));});
</script></body></html>
