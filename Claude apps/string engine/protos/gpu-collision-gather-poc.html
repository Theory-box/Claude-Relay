<!doctype html><html><head><meta charset="utf-8"><title>GPU collision-gather POC (layer 3c)</title>
<style>html,body{margin:0;height:100%;background:#080a12;overflow:auto;font:12px/1.5 monospace;color:#cde}

<script>
const COLLIDE=`
struct GP { count:u32, gx:u32, gy:u32, cap:u32, cell:f32, ox:f32, oy:f32, depth:f32, omega:f32, penClampFrac:f32, maxDisp:f32, pad0:f32, };
@group(0) @binding(0) var<storage, read>       pos       : array<vec4<f32>>;
@group(0) @binding(1) var<storage, read_write> posOut    : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read>       nodeRange : array<vec2<u32>>;
@group(0) @binding(3) var<storage, read>       nodeList  : array<u32>;
@group(0) @binding(4) var<storage, read>       segI      : array<vec4<u32>>;
@group(0) @binding(5) var<storage, read>       segF      : array<vec4<f32>>;
@group(0) @binding(6) var<storage, read>       segCell   : array<vec4<u32>>;
@group(0) @binding(7) var<storage, read>       cellBins  : array<u32>;
@group(0) @binding(8) var<uniform>             U         : GP;
struct CP { s:f32, t:f32, n:vec3<f32>, dist:f32, };
fn closestSeg(p1:vec3<f32>, q1:vec3<f32>, p2:vec3<f32>, q2:vec3<f32>) -> CP {
  let d1=q1-p1; let d2=q2-p2; let r=p1-p2;
  let a=dot(d1,d1); let e=dot(d2,d2); let ff=dot(d2,r); let lenEps=1e-9;
  var s=0.0; var t=0.0;
  if(a<=lenEps && e<=lenEps){ s=0.0; t=0.0; }
  else if(a<=lenEps){ s=0.0; t=clamp(ff/e,0.0,1.0); }
  else{ let c=dot(d1,r);
    if(e<=lenEps){ t=0.0; s=clamp(-c/a,0.0,1.0); }
    else{ let b=dot(d1,d2); let den=a*e-b*b;
      if(den > 1e-6*a*e){ s=clamp((b*ff-c*e)/den,0.0,1.0); } else { s=0.0; }
      t=(b*s+ff)/e;
      if(t<0.0){ t=0.0; s=clamp(-c/a,0.0,1.0); } else if(t>1.0){ t=1.0; s=clamp((b-c)/a,0.0,1.0); } } }
  let c1=p1+d1*s; let c2=p2+d2*t; var nrm=c1-c2; var dist=length(nrm);
  if(dist < 0.25){ var dir=d1; if(e>a){ dir=d2; } let dl=length(dir);
    if(dl>1e-4){ let uu=dir/dl; var perp=vec3<f32>(-uu.y,uu.x,0.0);
      let mid=((p1+q1)*0.5)-((p2+q2)*0.5); if(dot(perp,mid) < 0.0){ perp=-perp; } nrm=perp; dist=0.0001; } }
  var o:CP; o.s=s; o.t=t; o.n=nrm; o.dist=max(dist,0.0001); return o;
}
fn shareEndpoint(A:vec4<u32>, B:vec4<u32>) -> bool { return A.x==B.x || A.x==B.y || A.y==B.x || A.y==B.y; }
fn ownerCell(ca:vec4<u32>, cb:vec4<u32>) -> u32 { let xlo=max(ca.x,cb.x); let ylo=max(ca.z,cb.z); return ylo*U.gx + xlo; }
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid:vec3<u32>){
  let i=gid.x; if(i>=U.count){ return; }
  let pi=pos[i]; let p=pi.xyz; let invI=pi.w;
  if(invI==0.0){ posOut[i]=vec4<f32>(p,invI); return; }
  var accum=vec3<f32>(0.0); var contacts=0u;
  let rng=nodeRange[i]; let ns=rng.x; let nc=rng.y;
  for(var xi:u32=0u; xi<nc; xi=xi+1u){
    let X=nodeList[ns+xi]; let sxI=segI[X]; let sxC=segCell[X];
    for(var cy:u32=sxC.z; cy<=sxC.w; cy=cy+1u){
      for(var cx:u32=sxC.x; cx<=sxC.y; cx=cx+1u){
        let cellId=cy*U.gx+cx; let base=cellId*U.cap;
        for(var k:u32=0u; k<U.cap; k=k+1u){
          let Y=cellBins[base+k];
          if(Y==0xffffffffu){ break; }
          if(Y==X){ continue; }
          let syI=segI[Y]; let syC=segCell[Y];
          if(ownerCell(sxC,syC) != cellId){ continue; }
          if(shareEndpoint(sxI,syI)){ continue; }
          if((sxI.w & 1u)!=0u || (syI.w & 1u)!=0u){ continue; }
          let objX=sxI.w>>3u; let objY=syI.w>>3u;
          if(objX==objY && ((sxI.w>>2u)&1u)==0u){ continue; }
          let lo=min(X,Y); let hi=max(X,Y);
          if(sxI.z==syI.z){ let along=abs(i32(segF[X].z)-i32(segF[Y].z)); if(along < (i32(segF[lo].w)+1)){ continue; } }
          let la=segI[lo]; let ha=segI[hi];
          var lp0=pos[la.x].xyz; var lp1=pos[la.y].xyz; var hp0=pos[ha.x].xyz; var hp1=pos[ha.y].xyz;
          let use3=(U.depth>0.0) && !(((segI[lo].w>>1u)&1u)!=0u || ((segI[hi].w>>1u)&1u)!=0u);
          if(!use3){ lp0.z=0.0; lp1.z=0.0; hp0.z=0.0; hp1.z=0.0; }
          let cp=closestSeg(lp0,lp1,hp0,hp1);
          let tgt=segF[lo].x+segF[hi].x+max(segF[lo].y,segF[hi].y);
          if(cp.dist>=tgt){ continue; }
          let ov=min(tgt-cp.dist, U.penClampFrac*tgt);
          let u=cp.n/cp.dist;
          let mobLo=(pos[la.x].w+pos[la.y].w)*0.5; let mobHi=(pos[ha.x].w+pos[ha.y].w)*0.5; let Wt=mobLo+mobHi;
          if(Wt<=0.0){ continue; }
          let cLo=ov*mobLo/Wt; let cHi=ov*mobHi/Wt; let s=cp.s; let t=cp.t;
          var d=vec3<f32>(0.0);
          if(i==la.x){ d=u*cLo*(1.0-s); } else if(i==la.y){ d=u*cLo*s; }
          else if(i==ha.x){ d=-u*cHi*(1.0-t); } else if(i==ha.y){ d=-u*cHi*t; }
          accum=accum+d; contacts=contacts+1u;
        }
      }
    }
  }
  var delta=vec3<f32>(0.0);
  if(contacts>0u){ delta=accum/f32(contacts); delta=delta*U.omega; let m=length(delta); if(m>U.maxDisp){ delta=delta*(U.maxDisp/m); } }
  posOut[i]=vec4<f32>(p+delta, invI);
}`;

const hud=document.getElementById('hud'),errEl=document.getElementById('err');
// ---------------- scene: overlapping horizontal + vertical strands (chains) ----------------
const R=4.0, PAD=0.0, SPACING=12, DEPTH=0.0, OMEGA=1.0, PENFRAC=0.25, MAXDISP=6.0;
const nodes=[]; const segs=[]; // seg: {a,b,strand,along,obj,bond,solid,selfSolid}
let strandId=0;
function addStrand(x0,y0,dx,dy,count,obj,selfSolid){
  const start=nodes.length; for(let k=0;k<count;k++){nodes.push({x:x0+dx*k+(Math.random()-0.5)*2,y:y0+dy*k+(Math.random()-0.5)*2,inv:1});}
  for(let k=0;k<count-1;k++){segs.push({a:start+k,b:start+k+1,strand:strandId,along:k,obj:obj,bond:0,solid:0,selfSolid:selfSolid});}
  strandId++;
}
// horizontal strands (obj 0), vertical strands (obj 1). selfSolid=1 so same-strand DOES collide (but exclusion handles neighbors)
for(let r=0;r<16;r++) addStrand(60, 60+r*13, SPACING, 0, 26, 0, 1);
for(let c=0;c<16;c++) addStrand(60+c*13, 60, 0, SPACING, 26, 1, 1);
const N=nodes.length, numSeg=segs.length;
// skip/exclusion: skip = max(1, ceil(2R/max(1,rest))+1); rest≈SPACING
const skipK = Math.max(1, Math.ceil(2*R/Math.max(1,SPACING))+1);

// ---------------- grid ----------------
const reach=R+Math.max(0,PAD), cell=Math.max(10,2*reach);
let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
for(const n of nodes){if(n.x<minx)minx=n.x;if(n.y<miny)miny=n.y;if(n.x>maxx)maxx=n.x;if(n.y>maxy)maxy=n.y;}
const ox=minx-reach-cell, oy=miny-reach-cell;
const gx=Math.ceil((maxx-minx+2*reach+2*cell)/cell), gy=Math.ceil((maxy-miny+2*reach+2*cell)/cell);
const numCells=gx*gy, CAP=64;
// seg cell bounds (clamped) + bins
const segCell=new Uint32Array(numSeg*4);
const cellBins=new Uint32Array(numCells*CAP).fill(0xffffffff);
const cellFill=new Uint32Array(numCells);
let binOverflow=0;
for(let k=0;k<numSeg;k++){const a=nodes[segs[k].a],b=nodes[segs[k].b];
  let x0=Math.floor((Math.min(a.x,b.x)-reach-ox)/cell),x1=Math.floor((Math.max(a.x,b.x)+reach-ox)/cell);
  let y0=Math.floor((Math.min(a.y,b.y)-reach-oy)/cell),y1=Math.floor((Math.max(a.y,b.y)+reach-oy)/cell);
  x0=Math.max(0,Math.min(gx-1,x0));x1=Math.max(0,Math.min(gx-1,x1));y0=Math.max(0,Math.min(gy-1,y0));y1=Math.max(0,Math.min(gy-1,y1));
  segCell[k*4]=x0;segCell[k*4+1]=x1;segCell[k*4+2]=y0;segCell[k*4+3]=y1;
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const c=cy*gx+cx;
    if(cellFill[c]<CAP){cellBins[c*CAP+cellFill[c]]=k;cellFill[c]++;}else binOverflow++;}}
// node -> incident segment CSR
const incid=Array.from({length:N},()=>[]);
for(let k=0;k<numSeg;k++){incid[segs[k].a].push(k);incid[segs[k].b].push(k);}
const nodeRange=new Uint32Array(N*2); let tot=0; for(let i=0;i<N;i++)tot+=incid[i].length;
const nodeList=new Uint32Array(Math.max(1,tot)); let c=0;
for(let i=0;i<N;i++){nodeRange[i*2]=c;nodeRange[i*2+1]=incid[i].length;for(const s of incid[i]){nodeList[c++]=s;}}
// packed seg buffers
const segI=new Uint32Array(numSeg*4), segF=new Float32Array(numSeg*4);
for(let k=0;k<numSeg;k++){const s=segs[k];
  const packed=(s.bond?1:0)|((s.solid?1:0)<<1)|((s.selfSolid?1:0)<<2)|(s.obj<<3);
  segI[k*4]=s.a;segI[k*4+1]=s.b;segI[k*4+2]=s.strand;segI[k*4+3]=packed;
  segF[k*4]=R;segF[k*4+1]=PAD;segF[k*4+2]=s.along;segF[k*4+3]=skipK;}
// pos (x,y,h,invMass)
const pos=new Float32Array(N*4);
for(let i=0;i<N;i++){pos[i*4]=nodes[i].x;pos[i*4+1]=nodes[i].y;pos[i*4+2]=0;pos[i*4+3]=nodes[i].inv;}

// ---------------- CPU Jacobi mirror (faithful port of the shader) ----------------
function closestCPU(p1,q1,p2,q2){
  const d1=[q1[0]-p1[0],q1[1]-p1[1],q1[2]-p1[2]],d2=[q2[0]-p2[0],q2[1]-p2[1],q2[2]-p2[2]],r=[p1[0]-p2[0],p1[1]-p2[1],p1[2]-p2[2]];
  const dot=(u,v)=>u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
  const a=dot(d1,d1),e=dot(d2,d2),ff=dot(d2,r),lenEps=1e-9;let s=0,t=0;
  if(a<=lenEps&&e<=lenEps){s=0;t=0;}else if(a<=lenEps){s=0;t=Math.min(1,Math.max(0,ff/e));}
  else{const cc=dot(d1,r);if(e<=lenEps){t=0;s=Math.min(1,Math.max(0,-cc/a));}
    else{const b=dot(d1,d2),den=a*e-b*b; s=den>1e-6*a*e?Math.min(1,Math.max(0,(b*ff-cc*e)/den)):0; t=(b*s+ff)/e;
      if(t<0){t=0;s=Math.min(1,Math.max(0,-cc/a));}else if(t>1){t=1;s=Math.min(1,Math.max(0,(b-cc)/a));}}}
  const c1=[p1[0]+d1[0]*s,p1[1]+d1[1]*s,p1[2]+d1[2]*s],c2=[p2[0]+d2[0]*t,p2[1]+d2[1]*t,p2[2]+d2[2]*t];
  let nrm=[c1[0]-c2[0],c1[1]-c2[1],c1[2]-c2[2]],dist=Math.hypot(nrm[0],nrm[1],nrm[2]);
  if(dist<0.25){let dir=d1;if(e>a)dir=d2;const dl=Math.hypot(dir[0],dir[1],dir[2]);
    if(dl>1e-4){const uu=[dir[0]/dl,dir[1]/dl,dir[2]/dl];let perp=[-uu[1],uu[0],0];
      const mid=[(p1[0]+q1[0])*0.5-(p2[0]+q2[0])*0.5,(p1[1]+q1[1])*0.5-(p2[1]+q2[1])*0.5,0];
      if(perp[0]*mid[0]+perp[1]*mid[1]<0){perp=[-perp[0],-perp[1],0];} nrm=perp;dist=0.0001;}}
  return {s,t,n:nrm,dist:Math.max(dist,0.0001)};
}
function cpuMirror(){
  const disp=new Float32Array(N*3);
  const getp=(idx)=>[pos[idx*4],pos[idx*4+1],pos[idx*4+2]];
  for(let i=0;i<N;i++){const invI=pos[i*4+3]; if(invI===0)continue;
    let ax=0,ay=0,az=0,contacts=0; const ns=nodeRange[i*2],nc=nodeRange[i*2+1];
    for(let xi=0;xi<nc;xi++){const X=nodeList[ns+xi];
      const sxC=[segCell[X*4],segCell[X*4+1],segCell[X*4+2],segCell[X*4+3]];
      for(let cy=sxC[2];cy<=sxC[3];cy++)for(let cx=sxC[0];cx<=sxC[1];cx++){const cellId=cy*gx+cx,base=cellId*CAP;
        for(let k=0;k<CAP;k++){const Y=cellBins[base+k]; if(Y===0xffffffff)break; if(Y===X)continue;
          const syC=[segCell[Y*4],segCell[Y*4+1],segCell[Y*4+2],segCell[Y*4+3]];
          const owner=(Math.max(sxC[2],syC[2]))*gx+(Math.max(sxC[0],syC[0])); if(owner!==cellId)continue;
          const Xa=segI[X*4],Xb=segI[X*4+1],Ya=segI[Y*4],Yb=segI[Y*4+1];
          if(Xa===Ya||Xa===Yb||Xb===Ya||Xb===Yb)continue;
          const pkX=segI[X*4+3],pkY=segI[Y*4+3];
          if((pkX&1)||(pkY&1))continue;
          if((pkX>>3)===(pkY>>3)&&((pkX>>2)&1)===0)continue;
          const lo=Math.min(X,Y),hi=Math.max(X,Y);
          if(segI[X*4+2]===segI[Y*4+2]){const along=Math.abs(segF[X*4+2]-segF[Y*4+2]); if(along<(segF[lo*4+3]+1))continue;}
          const la=[segI[lo*4],segI[lo*4+1]],ha=[segI[hi*4],segI[hi*4+1]];
          let lp0=getp(la[0]),lp1=getp(la[1]),hp0=getp(ha[0]),hp1=getp(ha[1]);
          const use3=(DEPTH>0)&&!(((segI[lo*4+3]>>1)&1)||((segI[hi*4+3]>>1)&1));
          if(!use3){lp0=[lp0[0],lp0[1],0];lp1=[lp1[0],lp1[1],0];hp0=[hp0[0],hp0[1],0];hp1=[hp1[0],hp1[1],0];}
          const cp=closestCPU(lp0,lp1,hp0,hp1);
          const tgt=segF[lo*4]+segF[hi*4]+Math.max(segF[lo*4+1],segF[hi*4+1]);
          if(cp.dist>=tgt)continue;
          const ov=Math.min(tgt-cp.dist,PENFRAC*tgt),u=[cp.n[0]/cp.dist,cp.n[1]/cp.dist,cp.n[2]/cp.dist];
          const mobLo=(pos[la[0]*4+3]+pos[la[1]*4+3])*0.5,mobHi=(pos[ha[0]*4+3]+pos[ha[1]*4+3])*0.5,Wt=mobLo+mobHi;
          if(Wt<=0)continue; const cLo=ov*mobLo/Wt,cHi=ov*mobHi/Wt,s=cp.s,t=cp.t;
          let d=[0,0,0];
          if(i===la[0])d=[u[0]*cLo*(1-s),u[1]*cLo*(1-s),u[2]*cLo*(1-s)];
          else if(i===la[1])d=[u[0]*cLo*s,u[1]*cLo*s,u[2]*cLo*s];
          else if(i===ha[0])d=[-u[0]*cHi*(1-t),-u[1]*cHi*(1-t),-u[2]*cHi*(1-t)];
          else if(i===ha[1])d=[-u[0]*cHi*t,-u[1]*cHi*t,-u[2]*cHi*t];
          ax+=d[0];ay+=d[1];az+=d[2];contacts++;}}}
    if(contacts>0){let dx=ax/contacts*OMEGA,dy=ay/contacts*OMEGA,dz=az/contacts*OMEGA;
      const m=Math.hypot(dx,dy,dz); if(m>MAXDISP){dx*=MAXDISP/m;dy*=MAXDISP/m;dz*=MAXDISP/m;}
      disp[i*3]=dx;disp[i*3+1]=dy;disp[i*3+2]=dz;}}
  return disp;
}

async function run(){
  if(!navigator.gpu){hud.textContent='WebGPU not available';return;}
  const adapter=await navigator.gpu.requestAdapter();if(!adapter){hud.textContent='no adapter';return;}
  const device=await adapter.requestDevice();
  device.pushErrorScope('validation');
  const mod=device.createShaderModule({code:COLLIDE});
  const ci=await mod.getCompilationInfo();let bad=false;
  for(const m of ci.messages){if(m.type==='error'){bad=true;errEl.textContent+='WGSL L'+m.lineNum+':'+m.linePos+' '+m.message+'\n';}}
  const pipe=await device.createComputePipelineAsync({layout:'auto',compute:{module:mod,entryPoint:'main'}});
  const perr=await device.popErrorScope();if(perr)errEl.textContent+='pipeline: '+perr.message+'\n';
  if(bad){hud.textContent='shader compile failed';return;}
  const U=GPUBufferUsage,mk=(d,u)=>{const b=device.createBuffer({size:Math.max(16,d.byteLength),usage:u});device.queue.writeBuffer(b,0,d);return b;};
  const bPos=mk(pos,U.STORAGE|U.COPY_DST), bOut=device.createBuffer({size:N*16,usage:U.STORAGE|U.COPY_SRC});
  const bNR=mk(nodeRange,U.STORAGE|U.COPY_DST),bNL=mk(nodeList,U.STORAGE|U.COPY_DST);
  const bSI=mk(segI,U.STORAGE|U.COPY_DST),bSF=mk(segF,U.STORAGE|U.COPY_DST),bSC=mk(segCell,U.STORAGE|U.COPY_DST),bCB=mk(cellBins,U.STORAGE|U.COPY_DST);
  const ub=new ArrayBuffer(48),dv=new DataView(ub);
  dv.setUint32(0,N,true);dv.setUint32(4,gx,true);dv.setUint32(8,gy,true);dv.setUint32(12,CAP,true);
  dv.setFloat32(16,cell,true);dv.setFloat32(20,ox,true);dv.setFloat32(24,oy,true);dv.setFloat32(28,DEPTH,true);
  dv.setFloat32(32,OMEGA,true);dv.setFloat32(36,PENFRAC,true);dv.setFloat32(40,MAXDISP,true);dv.setFloat32(44,0,true);
  const bU=device.createBuffer({size:48,usage:U.UNIFORM|U.COPY_DST});device.queue.writeBuffer(bU,0,ub);
  const bg=device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[
    {binding:0,resource:{buffer:bPos}},{binding:1,resource:{buffer:bOut}},{binding:2,resource:{buffer:bNR}},{binding:3,resource:{buffer:bNL}},
    {binding:4,resource:{buffer:bSI}},{binding:5,resource:{buffer:bSF}},{binding:6,resource:{buffer:bSC}},{binding:7,resource:{buffer:bCB}},{binding:8,resource:{buffer:bU}}]});
  const enc=device.createCommandEncoder(),pass=enc.beginComputePass();pass.setPipeline(pipe);pass.setBindGroup(0,bg);pass.dispatchWorkgroups(Math.ceil(N/64));pass.end();
  const rb=device.createBuffer({size:N*16,usage:U.COPY_DST|U.MAP_READ});enc.copyBufferToBuffer(bOut,0,rb,0,N*16);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);const outArr=new Float32Array(rb.getMappedRange().slice(0));rb.unmap();
  // GPU displacement
  const gpuDisp=new Float32Array(N*3);
  for(let i=0;i<N;i++){gpuDisp[i*3]=outArr[i*4]-pos[i*4];gpuDisp[i*3+1]=outArr[i*4+1]-pos[i*4+1];gpuDisp[i*3+2]=outArr[i*4+2]-pos[i*4+2];}
  const cpuDisp=cpuMirror();
  // compare
  let maxErr=0,worst=-1,moved=0,cpuMoved=0;
  for(let i=0;i<N;i++){let e=0;for(let c=0;c<3;c++)e=Math.max(e,Math.abs(gpuDisp[i*3+c]-cpuDisp[i*3+c]));
    if(e>maxErr){maxErr=e;worst=i;}
    if(Math.hypot(gpuDisp[i*3],gpuDisp[i*3+1],gpuDisp[i*3+2])>1e-4)moved++;
    if(Math.hypot(cpuDisp[i*3],cpuDisp[i*3+1],cpuDisp[i*3+2])>1e-4)cpuMoved++;}
  const match=maxErr<0.01 && binOverflow===0;
  hud.innerHTML='<b>GPU COLLISION-GATHER POC · layer 3c (per-node Jacobi, home-cell dedup)</b>\n'+
    N.toLocaleString()+' nodes · '+numSeg.toLocaleString()+' segs · '+strandId+' strands · grid '+gx+'×'+gy+' · cell '+cell+' · skipK '+skipK+'\n'+
    'bin overflow: <b class="'+(binOverflow===0?'ok':'bad')+'">'+binOverflow+'</b> '+(binOverflow===0?'(✓ precondition met)':'(✗ broad phase incomplete — raise CAP)')+'\n'+
    'nodes pushed by collision: GPU '+moved.toLocaleString()+' / CPU '+cpuMoved.toLocaleString()+'\n'+
    'GPU vs CPU-Jacobi-mirror · max per-node displacement error: <b class="'+(maxErr<0.01?'ok':'bad')+'">'+maxErr.toExponential(3)+' px</b>'+(worst>=0?' <span class="dim">(worst node '+worst+')</span>':'')+'\n'+
    '<b class="'+(match?'ok':'bad')+'">'+(match?'✓✓ GPU collision matches CPU Jacobi reference — layer 3c gather validated':'✗ mismatch or overflow')+'</b>';
  draw(gpuDisp);
}
function draw(disp){
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  const sc=Math.min((cv.width-40)/(maxx-minx+40),(cv.height-40)/(maxy-miny+40)),px=20-minx*sc+10,py=20-miny*sc+10;
  const T=(x,y)=>[px+x*sc,py+y*sc];
  ctx.lineWidth=1.4;
  for(let k=0;k<numSeg;k++){const a=nodes[segs[k].a],b=nodes[segs[k].b],A=T(a.x,a.y),B=T(b.x,b.y);
    ctx.strokeStyle=segs[k].obj===0?'rgba(90,200,230,0.5)':'rgba(255,150,90,0.5)';ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
  // push arrows (x20)
  ctx.strokeStyle='#6ee7b7';ctx.lineWidth=1;
  for(let i=0;i<N;i++){const dx=disp[i*3],dy=disp[i*3+1];if(Math.hypot(dx,dy)<0.05)continue;
    const A=T(nodes[i].x,nodes[i].y),B=[A[0]+dx*sc*20,A[1]+dy*sc*20];ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
  ctx.fillStyle='#5a5f88';ctx.font='11px monospace';ctx.fillText('teal=obj0 strands, orange=obj1 strands, green arrows=collision push (×20) — should point away from crossings',10,cv.height-8);
}
run().catch(e=>{hud.textContent='error: '+e.message;errEl.textContent=String(e.stack||e);});
</script></body></html>
