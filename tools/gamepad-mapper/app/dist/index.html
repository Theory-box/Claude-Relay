<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamepad Mapper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <button id="run" class="primary">Start</button>
    <button id="save">Save</button>
    <button id="grant">Grant Accessibility</button>
    <button id="copylog">Copy log</button>
    <span id="status" class="status">stopped</span>
  </header>

  <section class="settings" id="settings">
    <strong>Cursor / feel</strong>
    <label>deadzone <input type="number" step="0.01" min="0" max="0.6" data-path="deadzone" /></label>
    <label><input type="checkbox" data-path="cursor.enabled" /> cursor on</label>
    <label>speed <input type="number" step="50" data-path="cursor.speed" /></label>
    <label>accel <input type="number" step="0.1" data-path="cursor.curve" /></label>
    <label><input type="checkbox" data-path="cursor.invert_y" /> invert Y</label>
    <label title="ignore button release blips shorter than this — raise it if a held button rapidly clicks">debounce ms <input type="number" step="5" min="0" max="400" data-path="release_debounce_ms" /></label>
    <strong style="margin-left:12px">Scroll stick</strong>
    <label><input type="checkbox" data-path="scroll.enabled" /> scroll on</label>
    <label>speed <input type="number" step="50" min="0" max="4000" data-path="scroll.speed" /></label>
    <label><input type="checkbox" data-path="scroll.invert_y" /> invert V</label>
    <label><input type="checkbox" data-path="scroll.invert_x" /> invert H</label>
    <label>vert axis: <span id="scrollYName">(none)</span> <button id="learnScrollY">learn</button></label>
    <label>horiz axis: <span id="scrollXName">(none)</span> <button id="learnScrollX">learn</button></label>
  </section>

  <div class="diag" id="diag">diagnostics…</div>
  <div class="diag" id="trace">trace…</div>

  <main>
    <div class="pane">
      <h3>Layers</h3>
      <ul id="layers" class="list"></ul>
      <div class="row">
        <input id="layerName" type="text" placeholder="new layer name" />
      </div>
      <div class="row">
        <button id="addLayer">+ add</button>
        <button id="renLayer">rename</button>
        <button id="delLayer">−</button>
      </div>
    </div>

    <div class="pane">
      <h3>Bindings</h3>
      <ul id="bindings" class="list"></ul>
      <div class="row">
        <button id="addBinding">+</button>
        <button id="delBinding">−</button>
        <button id="learnInput">Learn input</button>
      </div>
    </div>

    <div class="pane">
      <h3>Actions</h3>
      <div id="branchTabs" class="branchtabs"></div>
      <div id="phaseTabs" class="phasetabs"></div>
      <ul id="actions" class="list"></ul>
      <div class="row">
        <select id="actionType">
          <option value="key">key</option>
          <option value="mouse">mouse</option>
          <option value="scroll">scroll</option>
          <option value="modifier">modifier</option>
          <option value="enter_layer">enter_layer</option>
          <option value="exit_layer">exit_layer</option>
          <option value="precision">precision (slow cursor)</option>
          <option value="cursor">cursor on/off</option>
        </select>
        <button id="addAction">+</button>
        <button id="delAction">−</button>
      </div>
      <div id="fields" class="fields"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
