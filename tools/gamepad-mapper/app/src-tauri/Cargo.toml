[package]
name = "gamepad-mapper"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[profile.release]
strip = true
