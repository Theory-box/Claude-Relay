<!doctype html>
<html><head><meta charset="utf-8"><title>Desktop Canvas</title>
<style>
 html,body{margin:0;height:100%;background:#15161a;color:#cfd2da;font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden;}
 .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
 h1{font-weight:600;font-size:30px;margin:0;letter-spacing:.01em;}
 .v{opacity:.55;font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
 .hint{opacity:.4;font-size:12px;margin-top:6px;}
 button{background:#2a2d36;color:#e7e9ef;border:1px solid #3a3e49;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;}
 button:hover{background:#343843;}
</style></head>
<body>
 <div class="wrap">
   <h1>Desktop Canvas</h1>
   <div class="v">v0.0.1 &middot; pipeline test</div>
   <button id="q">Quit</button>
   <div class="hint">Esc also quits &middot; if stuck, end the task in Task Manager</div>
 </div>
 <script>
   function quit(){ try{ window.__TAURI__.core.invoke('quit'); }catch(e){ console.error(e); } }
   document.getElementById('q').addEventListener('click', quit);
   window.addEventListener('keydown', function(e){ if(e.key==='Escape') quit(); });
 </script>
</body></html>
