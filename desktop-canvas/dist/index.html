<!doctype html>
<html><head><meta charset="utf-8"><title>Desktop Canvas</title>
<style>
 html,body{margin:0;height:100%;background:#15161a;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif;}
 #root{position:fixed;inset:0;} .pane{position:absolute;overflow:hidden;background:#15161a;isolation:isolate;} .pane.focused{box-shadow:inset 0 0 0 2px #3a6fd0;} .divider{position:absolute;z-index:9;background:#23262e;} .divider.v{cursor:col-resize;} .divider:hover{background:#3a6fd0;}
 #err{position:fixed;top:0;left:0;right:0;max-height:40%;overflow:auto;padding:10px 14px;background:#3a1d1d;color:#ffd7d7;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;display:none;z-index:20;}
 #errX{position:absolute;top:6px;right:10px;background:#5a2a2a;color:#ffd7d7;border:1px solid #7a3a3a;border-radius:5px;width:22px;height:22px;line-height:1;cursor:pointer;font-size:14px;}
 #errtxt{display:block;padding-right:30px;}
  .viewer{position:fixed;width:720px;height:540px;min-width:240px;min-height:160px;max-width:96vw;max-height:96vh;background:#15161a;border:1px solid #3a4356;border-radius:10px;box-shadow:0 20px 64px rgba(0,0,0,.62);z-index:50;display:flex;flex-direction:column;overflow:hidden;resize:both;}
  .viewerBar{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#1c1f27;cursor:move;flex:0 0 auto;user-select:none;}
  .viewerTitle{flex:1;color:#c4c8d2;font:12px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .viewerNav{display:flex;gap:4px;}
  .viewer button{background:#2a2f3a;color:#cfd2da;border:0;border-radius:6px;width:28px;height:24px;cursor:pointer;font-size:15px;line-height:1;}
  .viewerClose{background:#3a2a2a !important;}
  .viewerBody{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;background:#0c0d10;cursor:grab;}
  .viewerImg{width:100%;height:100%;object-fit:contain;display:block;transform-origin:center center;will-change:transform;}
  .editor{position:fixed;width:640px;height:480px;min-width:280px;min-height:180px;max-width:96vw;max-height:96vh;background:#15161a;border:1px solid #3a4356;border-radius:10px;box-shadow:0 20px 64px rgba(0,0,0,.62);z-index:50;display:flex;flex-direction:column;overflow:hidden;resize:both;}
  .editor button{background:#2a2f3a;color:#cfd2da;border:0;border-radius:6px;height:24px;cursor:pointer;font-size:13px;padding:0 10px;}
  .editorSave{background:#274b32 !important;color:#d8f0df !important;}
  .editorArea{flex:1 1 auto;min-height:0;width:100%;border:0;outline:0;resize:none;background:#0f1115;color:#d6dae2;font:14px/1.5 ui-monospace,Consolas,monospace;padding:10px 12px;box-sizing:border-box;}
  .props{position:fixed;width:360px;background:#15161a;border:1px solid #3a4356;border-radius:10px;box-shadow:0 20px 64px rgba(0,0,0,.62);z-index:50;overflow:hidden;}
  .props button{background:#2a2f3a;color:#cfd2da;border:0;border-radius:6px;height:24px;cursor:pointer;font-size:13px;padding:0 8px;}
  .propsBody{padding:10px 14px;}
  .propsRow{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #23262e;font-size:13px;}
  .propsRow:last-child{border-bottom:0;}
  .propsK{color:#8b93a3;min-width:74px;}
  .propsV{color:#d6dae2;word-break:break-all;flex:1;}
  .portalwin{position:fixed;width:280px;background:#15161a;border:1px solid #3a4356;border-radius:10px;box-shadow:0 20px 64px rgba(0,0,0,.62);z-index:55;overflow:hidden;}
  .portalwin button{background:#2a2f3a;color:#cfd2da;border:0;border-radius:6px;height:24px;cursor:pointer;font-size:13px;padding:0 8px;}
  .portalBody{padding:12px 14px;}
  .portalHint{color:#8b93a3;font-size:11px;margin-bottom:10px;}
  .portalChips{display:flex;flex-direction:column;gap:8px;}
  .portalChip{display:flex;align-items:center;gap:8px;background:#241b33;border:1px solid #7a5cc0;border-radius:8px;padding:8px 10px;color:#cdbff0;cursor:grab;font-size:13px;user-select:none;}
  .portalChip.placed{opacity:0.5;cursor:default;border-color:#3a3e49;}
  .portalGlyph{color:#9b7be0;font-size:16px;}
  .portalGhost{position:fixed;pointer-events:none;z-index:9999;color:#9b7be0;font-size:22px;text-shadow:0 0 6px #000;}
 #bar{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(26,28,33,.92);border-bottom:1px solid #2a2d36;z-index:8;font-size:13px;color:#c4c8d2;}
 #bar button{background:#252934;border:1px solid #353a45;color:#d4d7df;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;white-space:nowrap;}
 #bar button:hover:not(:disabled){background:#2f3440;}
 #bar button:disabled{opacity:.32;cursor:default;}
 #bar input{background:#1c1f27;border:1px solid #3a4150;color:#e6e8ee;border-radius:6px;padding:5px 8px;font:inherit;}
 #pathInput{width:320px;}
 #safetyLbl{display:flex;align-items:center;gap:5px;color:#8b9bb0;cursor:pointer;user-select:none;white-space:nowrap;font-size:12px;}
 #safetyLbl.off{color:#e0a55c;}
 #safetyLbl input{cursor:pointer;}
 .spacer{flex:1;}
 #crumbs{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:52vw;}
 .crumb{cursor:pointer;color:#8d93a0;padding:2px 4px;border-radius:4px;}
 .crumb:hover{color:#cfd3db;background:#252934;}
 .crumb.last{color:#e6e8ee;cursor:default;font-weight:600;}
 .crumb.last:hover{background:none;}
 .sep2{color:#565b64;}
 #hud{position:absolute;left:14px;bottom:12px;color:#8a8f9a;font-size:12px;z-index:5;pointer-events:none;letter-spacing:.02em;}
 #diag{position:absolute;right:12px;bottom:12px;color:#52555e;font:11px ui-monospace,Consolas,monospace;z-index:5;pointer-events:none;}
 .pop{position:absolute;display:none;z-index:30;min-width:178px;background:#1f2229;border:1px solid #353a45;border-radius:8px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px;max-height:78vh;overflow:auto;}
 .pop button{display:block;width:100%;text-align:left;background:none;border:0;color:#d4d7df;padding:8px 12px;border-radius:5px;cursor:pointer;font:inherit;}
 .pop button:hover{background:#2c313c;}
 .pop .arrow{float:right;color:#7d828c;}
 .pop .sep{height:1px;background:#353a45;margin:5px 6px;}
 .pop .danger{color:#e7a3a3;} .pop .danger:hover{background:#3a2326;color:#ffb0b0;}
 .modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:center;justify-content:center;}
 .modal .box{background:#1f2229;border:1px solid #353a45;border-radius:10px;padding:18px 20px;min-width:300px;max-width:80vw;color:#e6e8ee;font-size:14px;line-height:1.5;box-shadow:0 12px 40px rgba(0,0,0,.6);}
 .modal .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
 .modal button{background:#2a2f3a;border:1px solid #3a4150;color:#e6e8ee;border-radius:7px;padding:7px 16px;cursor:pointer;font:inherit;}
 .modal #dlgYes,.modal #pmYes{background:#2f5fbf;border-color:#3a6fd0;}
 .modal button:hover{filter:brightness(1.18);}
 .modal input{margin-top:12px;width:100%;box-sizing:border-box;background:#1c1f27;border:1px solid #3a4150;color:#e6e8ee;border-radius:7px;padding:8px;font:inherit;}
 #boxsel{position:absolute;display:none;z-index:6;border:1px solid #6fa8ff;background:rgba(91,157,255,.14);pointer-events:none;border-radius:2px;}
 #search{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:18;display:none;align-items:center;gap:10px;background:rgba(28,31,39,.97);border:1px solid #3a4356;border-radius:30px;padding:10px 18px;box-shadow:0 10px 36px rgba(0,0,0,.55);}
 #search input{background:transparent;border:0;outline:0;color:#eef1f6;font-size:17px;width:300px;font-family:inherit;}
 #search input::placeholder{color:#6b7280;}
 #searchCount{color:#7f8696;font-size:13px;font-variant-numeric:tabular-nums;min-width:54px;text-align:right;}
 #searchHint{color:#5b6270;font-size:11px;border-left:1px solid #3a4356;padding-left:10px;}
 canvas{display:block;}
</style></head>
<body>
 <div id="err"><button id="errX" title="Dismiss">&#215;</button><span id="errtxt"></span></div>
 <div id="root"></div>
 <template id="paneTpl">
 <div id="bar">
   <button id="back" title="Back (last visited)">&#8592;</button>
   <button id="fwd" title="Forward">&#8594;</button>
   <button id="up" title="Up one folder">&#8593;</button>
   <button id="spacesBtn">Spaces &#9662;</button>
   <span id="crumbs"></span>
   <span class="spacer"></span>
   <input id="pathInput" placeholder="Type or paste a path, Enter to go" style="display:none">
   <button id="goto">Go to&#8230;</button>
   <button id="prefs">Settings</button>
   <label id="safetyLbl" title="Safety: when on, file changes are limited to the Desktop Canvas folder. Turn off to edit anywhere (with confirmations)."><span id="safetyIcon">&#128274;</span><input type="checkbox" id="safetyChk" checked><span id="safetyTxt">safe</span></label>
 </div>
 <div id="hud"></div>
 <div id="diag"></div>
 <div id="menu" class="pop"></div>
 <div id="sortMenu" class="pop"></div>
 <div id="spacesMenu" class="pop"></div>
 <div id="dialog" class="modal"><div class="box"><div id="dlgMsg"></div><div class="row"><button id="dlgNo">Cancel</button><button id="dlgYes">Move</button></div></div></div>
 <div id="prompt" class="modal"><div class="box"><div id="pmMsg"></div><input id="pmInput"><div class="row"><button id="pmNo">Cancel</button><button id="pmYes">Create</button></div></div></div>
 <div id="boxsel"></div>
 <div id="search"><span style="color:#6fa8ff;font-size:15px;">&#8981;</span><input id="searchInput" placeholder="Search this space&#8230;" autocomplete="off" spellcheck="false"><span id="searchCount"></span><span id="searchHint">Enter = frame &#183; Esc = close</span></div>
 </template>
