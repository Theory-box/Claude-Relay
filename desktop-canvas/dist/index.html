<!doctype html>
<html><head><meta charset="utf-8"><title>Desktop Canvas</title>
<style>
 html,body{margin:0;height:100%;background:#15161a;overflow:hidden;}
 #err{position:fixed;top:0;left:0;right:0;max-height:40%;overflow:auto;padding:10px 14px;background:#3a1d1d;color:#ffd7d7;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;display:none;z-index:20;}
 #hud{position:fixed;left:14px;bottom:12px;color:#6b6f7a;font:12px system-ui,"Segoe UI",sans-serif;z-index:5;pointer-events:none;letter-spacing:.03em;}
 #diag{position:fixed;right:12px;bottom:12px;color:#52555e;font:11px ui-monospace,Consolas,monospace;z-index:5;pointer-events:none;}
 #menu{position:fixed;display:none;z-index:30;min-width:172px;background:#1f2229;border:1px solid #353a45;border-radius:8px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.5);font:13px system-ui,"Segoe UI",sans-serif;}
 #menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#d4d7df;padding:8px 12px;border-radius:5px;cursor:pointer;font:inherit;}
 #menu button:hover{background:#2c313c;}
 #menu .sep{height:1px;background:#353a45;margin:5px 6px;}
 #menu .danger{color:#e7a3a3;}
 #menu .danger:hover{background:#3a2326;color:#ffb0b0;}
 canvas{display:block;}
</style></head>
<body>
 <div id="err"></div>
 <div id="hud">Desktop Canvas v0.0.10 &middot; drop a file &middot; drag onto Trash Can to delete &middot; drag/scroll to pan &middot; Ctrl+scroll zoom &middot; double-click open &middot; right-click menu &middot; Esc quit</div>
 <div id="diag"></div>
 <div id="menu"></div>
 <script src="pixi.min.js"></script>
 <script>
 function showErr(m){ var e=document.getElementById('err'); e.style.display='block'; e.textContent += m + "\n"; }
 window.addEventListener('error', function(ev){ showErr('JS error: ' + (ev.message || ev.error)); });
 window.addEventListener('keydown', function(e){ if(e.key==='Escape'){ try{ window.__TAURI__.core.invoke('quit'); }catch(_){} } });

 (function(){
   try{
     if(typeof PIXI==='undefined'){ showErr('PIXI failed to load'); return; }
     var T = window.__TAURI__;

     var myLabel = 'main';
     try{ if (T.webviewWindow && T.webviewWindow.getCurrentWebviewWindow) myLabel = T.webviewWindow.getCurrentWebviewWindow().label || 'main'; }catch(_){}
     var isMain = (myLabel === 'main');

     var app = new PIXI.Application({ resizeTo: window, background: 0x15161a, antialias: true, autoDensity: true, resolution: window.devicePixelRatio || 1 });
     document.body.appendChild(app.view);

     var world = new PIXI.Container();
     app.stage.addChild(world);

     var grid = new PIXI.Graphics();
     grid.beginFill(0x2a2d36);
     var R = 1600, step = 64;
     for (var gx = -R; gx <= R; gx += step) for (var gy = -R; gy <= R; gy += step) grid.drawCircle(gx, gy, 1.3);
     grid.endFill();
     world.addChild(grid);
     world.x = app.screen.width / 2; world.y = app.screen.height / 2;

     var items = [];
     var cards = [];
     var thumbCache = {};
     var mtimes = {};
     var trash = { x: -320, y: -210 };
     var trashNode = null;
     var panning = false, last = null, dragTarget = null, dragOff = null;
     var reloadPending = false;

     function loadTexture(url){
       if (PIXI.Assets && PIXI.Assets.load) return PIXI.Assets.load(url);
       return new Promise(function(res, rej){
         var t = PIXI.Texture.from(url);
         if (t.baseTexture && t.baseTexture.valid) { res(t); return; }
         t.baseTexture.once('loaded', function(){ res(t); });
         t.baseTexture.once('error', function(){ rej('texture error'); });
       });
     }
     function getThumb(name){
       if (name in thumbCache) return Promise.resolve(thumbCache[name]);
       return T.core.invoke('thumb_data', { name: name }).then(function(url){ thumbCache[name] = url; return url; });
     }
     function cardForName(name){ for (var i=0;i<cards.length;i++){ if (cards[i].__item && cards[i].__item.name===name) return cards[i]; } return null; }
     function rectsOverlap(a,b){ return a.x < b.x+b.width && a.x+a.width > b.x && a.y < b.y+b.height && a.y+a.height > b.y; }

     function applyThumb(card){
       var name = card.__item.name;
       getThumb(name).then(function(url){
         if (!url) return;
         loadTexture(url).then(function(tex){
           if (!card.__item || card.destroyed) return;
           var maxW = 240, maxH = 180;
           var s = Math.min(maxW / tex.width, maxH / tex.height, 1);
           var w = Math.max(1, Math.round(tex.width * s)), h = Math.max(1, Math.round(tex.height * s));
           var sp = new PIXI.Sprite(tex); sp.width = w; sp.height = h; sp.x = 4; sp.y = 22;
           var frame = new PIXI.Graphics(); frame.beginFill(0x1c1f27); frame.lineStyle(1, 0x3a3e49); frame.drawRoundedRect(0, 0, w + 8, h + 30, 8); frame.endFill();
           var cap = new PIXI.Text(name, { fill: 0xb6bac4, fontSize: 11, fontFamily: 'system-ui', wordWrap: true, wordWrapWidth: w });
           cap.x = 5; cap.y = 5;
           var old = card.removeChildren(); old.forEach(function(o){ try{ o.destroy(); }catch(_){} });
           card.addChild(frame); card.addChild(sp); card.addChild(cap);
           card.hitArea = new PIXI.Rectangle(0, 0, w + 8, h + 30);
         }).catch(function(e){ showErr('tex: ' + e); });
       }).catch(function(e){ showErr('thumb: ' + e); });
     }

     function attachDrag(obj){
       obj.on('pointerdown', function(e){
         if (e.button === 2) return;
         dragTarget = obj; obj.cursor = 'grabbing'; panning = false;
         var p = e.global;
         dragOff = { x: (p.x - world.x) / world.scale.x - obj.x, y: (p.y - world.y) / world.scale.y - obj.y };
         e.stopPropagation();
       });
     }

     function buildCard(item){
       var card = new PIXI.Container();
       card.x = item.x; card.y = item.y;
       card.eventMode = 'static'; card.cursor = 'grab';
       card.__item = item;
       var g = new PIXI.Graphics();
       g.beginFill(0x232633); g.lineStyle(1, 0x3a3e49); g.drawRoundedRect(0, 0, 210, 66, 10); g.endFill();
       card.addChild(g);
       var label = new PIXI.Text(item.name, { fill: 0xcfd2da, fontSize: 13, fontFamily: 'system-ui', wordWrap: true, wordWrapWidth: 190 });
       label.x = 12; label.y = 11; card.addChild(label);
       card.hitArea = new PIXI.Rectangle(0, 0, 210, 66);
       attachDrag(card);
       world.addChild(card);
       cards.push(card);
       applyThumb(card);
       return card;
     }

     function buildTrash(){
       var t = new PIXI.Container();
       t.__trash = true;
       var g = new PIXI.Graphics();
       g.lineStyle(2, 0x6b7079); g.beginFill(0x2a2e36); g.drawRoundedRect(12, 26, 56, 60, 6); g.endFill();
       g.beginFill(0x3a3f49); g.lineStyle(0); g.drawRoundedRect(6, 14, 68, 12, 3); g.endFill();
       g.beginFill(0x3a3f49); g.drawRoundedRect(31, 6, 18, 8, 3); g.endFill();
       g.lineStyle(2, 0x565b64);
       g.moveTo(30, 34); g.lineTo(30, 78); g.moveTo(40, 34); g.lineTo(40, 78); g.moveTo(50, 34); g.lineTo(50, 78);
       t.addChild(g);
       var lbl = new PIXI.Text('Trash Can', { fill: 0x9aa0ab, fontSize: 12, fontFamily: 'system-ui' });
       lbl.x = 40 - lbl.width / 2; lbl.y = 90; t.addChild(lbl);
       t.eventMode = 'static'; t.cursor = 'grab';
       t.hitArea = new PIXI.Rectangle(0, 0, 80, 106);
       t.x = trash.x; t.y = trash.y;
       attachDrag(t);
       world.addChild(t);
       return t;
     }

     function persist(){
       try{
         return T.core.invoke('save_layout', { data: JSON.stringify({ items: items, trash: trash }) })
           .then(function(){ try{ T.event.emit('layout-changed', {}); }catch(_){} })
           .catch(function(e){ showErr('save_layout: ' + e); });
       }catch(e){ showErr('persist: ' + e); }
     }

     async function loadLayout(){
       try{
         var s = await T.core.invoke('load_layout');
         var parsed = JSON.parse(s || '{}');
         var arr, tr;
         if (Array.isArray(parsed)) { arr = parsed; tr = null; } else { arr = parsed.items || []; tr = parsed.trash || null; }
         if (tr) trash = tr;
         arr.forEach(function(it){ items.push(it); buildCard(it); });
         if (trashNode) { trashNode.x = trash.x; trashNode.y = trash.y; }
       }catch(e){ showErr('load_layout: ' + e); }
     }

     async function reconcile(){
       for (var i = 0; i < cards.length; i++){ try{ world.removeChild(cards[i]); cards[i].destroy({ children: true }); }catch(_){} }
       cards = []; items = [];
       await loadLayout();
     }

     function moveToTrash(card){
       var name = card.__item.name;
       try{
         T.core.invoke('trash_item', { name: name }).then(function(){
           var idx = items.indexOf(card.__item); if (idx >= 0) items.splice(idx, 1);
           var ci = cards.indexOf(card); if (ci >= 0) cards.splice(ci, 1);
           world.removeChild(card); card.destroy({ children: true });
           delete mtimes[name]; delete thumbCache[name];
           persist();
         }).catch(function(e){ showErr('trash: ' + e); });
       }catch(e){ showErr('trash: ' + e); }
     }

     async function pollFolder(){
       if (!isMain) return;
       try{
         var s = await T.core.invoke('list_canvas');
         var list = JSON.parse(s || '[]');
         var present = {}, changed = false, edited = [];
         var have = {}; items.forEach(function(it){ have[it.name] = it; });
         for (var i = 0; i < list.length; i++){
           var f = list[i]; present[f.name] = true;
           if (!(f.name in have)){
             var n = items.length;
             var it = { name: f.name, x: 40 + (n % 6) * 240, y: 40 + Math.floor(n / 6) * 150 };
             items.push(it); buildCard(it); changed = true;
           } else if (mtimes[f.name] !== undefined && mtimes[f.name] !== f.mtime){
             edited.push(f.name);
           }
           mtimes[f.name] = f.mtime;
         }
         var gone = [];
         items.forEach(function(it){ if (!present[it.name]) gone.push(it); });
         gone.forEach(function(it){
           var c = cardForName(it.name);
           if (c){ var ci = cards.indexOf(c); if (ci >= 0) cards.splice(ci, 1); world.removeChild(c); c.destroy({ children: true }); }
           var ii = items.indexOf(it); if (ii >= 0) items.splice(ii, 1);
           delete mtimes[it.name]; changed = true;
         });
         edited.forEach(function(nm){ delete thumbCache[nm]; var c = cardForName(nm); if (c) applyThumb(c); try{ T.event.emit('thumb-changed', { name: nm }); }catch(_){} });
         if (changed) persist();
       }catch(e){ showErr('poll: ' + e); }
     }

     app.stage.eventMode = 'static';
     app.stage.hitArea = app.screen;
     app.stage.on('pointerdown', function(e){ if (e.button === 2) return; panning = true; last = { x: e.global.x, y: e.global.y }; });
     app.stage.on('pointermove', function(e){
       if (dragTarget) {
         var p = e.global;
         dragTarget.x = (p.x - world.x) / world.scale.x - dragOff.x;
         dragTarget.y = (p.y - world.y) / world.scale.y - dragOff.y;
       } else if (panning && last) {
         world.x += e.global.x - last.x; world.y += e.global.y - last.y;
         last = { x: e.global.x, y: e.global.y };
       }
     });
     function endAll(){
       if (dragTarget) {
         if (dragTarget.__trash) {
           trash.x = dragTarget.x; trash.y = dragTarget.y; persist();
         } else if (dragTarget.__item) {
           if (trashNode && rectsOverlap(dragTarget.getBounds(), trashNode.getBounds())) {
             moveToTrash(dragTarget);
           } else {
             dragTarget.__item.x = dragTarget.x; dragTarget.__item.y = dragTarget.y; persist();
           }
         }
       }
       panning = false; last = null; if (dragTarget) dragTarget.cursor = 'grab'; dragTarget = null; dragOff = null;
       if (reloadPending) { reloadPending = false; reconcile(); }
     }
     app.stage.on('pointerup', endAll);
     app.stage.on('pointerupoutside', endAll);

     window.addEventListener('wheel', function(ev){
       ev.preventDefault();
       if (ev.ctrlKey) {
         var mx = ev.clientX, my = ev.clientY;
         var wx = (mx - world.x) / world.scale.x, wy = (my - world.y) / world.scale.y;
         var ns = Math.min(8, Math.max(0.1, world.scale.x * Math.exp(-ev.deltaY * 0.01)));
         world.scale.set(ns);
         world.x = mx - wx * ns; world.y = my - wy * ns;
       } else {
         world.x -= ev.deltaX; world.y -= ev.deltaY;
       }
     }, { passive: false });

     function targetAt(cx, cy){
       for (var i = cards.length - 1; i >= 0; i--){
         var b = cards[i].getBounds();
         if (cx >= b.x && cx <= b.x + b.width && cy >= b.y && cy <= b.y + b.height) return cards[i];
       }
       if (trashNode){ var tb = trashNode.getBounds(); if (cx >= tb.x && cx <= tb.x + tb.width && cy >= tb.y && cy <= tb.y + tb.height) return trashNode; }
       return null;
     }

     var menu = document.getElementById('menu');
     var menuTarget = null;
     function hideMenu(){ menu.style.display = 'none'; menuTarget = null; }
     function mkBtn(label, cls, fn){ var b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.addEventListener('click', function(ev){ ev.stopPropagation(); fn(); }); return b; }
     function mkSep(){ var d = document.createElement('div'); d.className = 'sep'; return d; }
     function openMenu(x, y, target){
       menuTarget = target; menu.innerHTML = '';
       if (target.__trash){
         menu.appendChild(mkBtn('Open Trash Can folder', '', function(){ T.core.invoke('open_trash'); hideMenu(); }));
         menu.appendChild(mkSep());
         var armed = false;
         var clr = document.createElement('button'); clr.textContent = 'Clear Trash Can'; clr.className = 'danger';
         clr.addEventListener('click', function(ev){ ev.stopPropagation(); if (!armed){ armed = true; clr.textContent = 'Confirm: delete all?'; return; } T.core.invoke('clear_trash'); hideMenu(); });
         menu.appendChild(clr);
       } else {
         var name = target.__item.name;
         menu.appendChild(mkBtn('Open', '', function(){ T.core.invoke('open_item', { name: name }); hideMenu(); }));
         menu.appendChild(mkBtn('Open with\u2026', '', function(){ T.core.invoke('shell_verb', { name: name, verb: 'openas' }); hideMenu(); }));
         menu.appendChild(mkBtn('Open folder', '', function(){ T.core.invoke('open_folder'); hideMenu(); }));
         menu.appendChild(mkSep());
         menu.appendChild(mkBtn('Delete', 'danger', function(){ moveToTrash(target); hideMenu(); }));
       }
       menu.style.left = x + 'px'; menu.style.top = y + 'px'; menu.style.display = 'block';
     }
     app.view.addEventListener('contextmenu', function(ev){ ev.preventDefault(); var c = targetAt(ev.clientX, ev.clientY); if (c) openMenu(ev.clientX, ev.clientY, c); else hideMenu(); });
     app.view.addEventListener('dblclick', function(ev){ var c = targetAt(ev.clientX, ev.clientY); if (!c) return; if (c.__trash) T.core.invoke('open_trash'); else T.core.invoke('open_item', { name: c.__item.name }); });
     window.addEventListener('pointerdown', function(ev){ if (menu.style.display === 'block' && !menu.contains(ev.target)) hideMenu(); }, true);
     window.addEventListener('wheel', hideMenu, true);

     function handleDrop(payload){
       try{
         var paths = (payload && payload.paths) || [];
         var pos = (payload && payload.position) || { x: 0, y: 0 };
         var dpr = window.devicePixelRatio || 1;
         var cssX = pos.x / dpr, cssY = pos.y / dpr;
         var baseWX = (cssX - world.x) / world.scale.x;
         var baseWY = (cssY - world.y) / world.scale.y;
         (async function(){
           for (var i = 0; i < paths.length; i++){
             try{
               var name = await T.core.invoke('add_dropped_file', { path: paths[i] });
               if (cardForName(name)) continue;
               var it = { name: name, x: baseWX + i * 26, y: baseWY + i * 26 };
               items.push(it); buildCard(it);
             }catch(e){ showErr('add_dropped_file: ' + e); }
           }
           persist();
         })();
       }catch(e){ showErr('drop: ' + e); }
     }

     function wireDrop(handler){
       try{ if (T.webviewWindow && T.webviewWindow.getCurrentWebviewWindow){ T.webviewWindow.getCurrentWebviewWindow().onDragDropEvent(function(e){ if (e.payload && e.payload.type === 'drop') handler(e.payload); }); return; } }catch(_){}
       try{ if (T.webview && T.webview.getCurrentWebview){ T.webview.getCurrentWebview().onDragDropEvent(function(e){ if (e.payload && e.payload.type === 'drop') handler(e.payload); }); return; } }catch(_){}
       try{ T.event.listen('tauri://drag-drop', function(e){ handler(e.payload); }); }catch(err){ showErr('drop wiring failed: ' + err); }
     }

     try{ T.event.listen('layout-changed', function(){ if (dragTarget || panning) { reloadPending = true; return; } reconcile(); }); }catch(e){ showErr('sync listen: ' + e); }
     try{ T.event.listen('thumb-changed', function(e){ var nm = e.payload && e.payload.name; if (!nm) return; delete thumbCache[nm]; var c = cardForName(nm); if (c) applyThumb(c); }); }catch(_){}

     var diag = document.getElementById('diag');
     app.ticker.add(function(){ diag.textContent = 'zoom ' + Math.round(world.scale.x * 100) + '%  items ' + items.length + (isMain ? '  [main]' : ''); });

     (async function(){
       await loadLayout();
       trashNode = buildTrash();
       await pollFolder();
       if (isMain) setInterval(pollFolder, 3000);
     })();
     wireDrop(handleDrop);
   }catch(err){ showErr('init error: ' + (err && err.message ? err.message : err)); }
 })();
 </script>
</body></html>
